name: Build TKProtect .mpp

# Builds the patch bundle in the cloud. No local Java or Android SDK required.
# Open Actions -> "Build TKProtect .mpp" -> Run workflow, then download the artifact.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The Morphe Gradle plugin provisions the Android SDK automatically.
      - name: Build patches bundle
        run: ./gradlew buildAndroid --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload .mpp
        uses: actions/upload-artifact@v5
        with:
          name: tkprotect-mpp
          path: patches/build/libs/patches-*.mpp
          if-no-files-found: error
